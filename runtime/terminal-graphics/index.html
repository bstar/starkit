<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src 'self'">
<style>
html,body{margin:0;overflow:hidden;width:100%;height:100%;background:#1e1e2e}
canvas,#surfaces{position:absolute;inset:0;width:100%;height:100%}
#surfaces{pointer-events:none;font-family:system-ui,sans-serif}
.surface{position:absolute;box-sizing:border-box;overflow:hidden}
.panel{border:1px solid var(--border);border-radius:9px;box-shadow:0 2px 6px #0002}
.panel.active{border-color:var(--accent)}
.row{display:flex;align-items:center;gap:8px;padding:0 5px;white-space:nowrap}
.row .name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.selected{border-radius:5px;box-shadow:inset 2px 0 var(--accent)}
.icon{width:16px;height:16px;flex:none;color:var(--accent)}
.mark{width:10px;height:10px;border:1px solid currentColor;border-radius:50%;flex:none;opacity:.5}
.mark.on{background:var(--accent);border-color:var(--accent);opacity:1}
.tab{display:flex;align-items:center;justify-content:center;white-space:nowrap;border-radius:6px;padding:0 14px}
.tab.active{background:color-mix(in srgb,var(--tab) 82%,var(--accent));box-shadow:inset 0 -2px var(--accent)}
.meter{border-radius:2px;overflow:hidden;transform:translateY(7px);max-height:6px}
.meter>div{height:100%}
img{object-fit:contain}
</style></head><body><canvas id="cells"></canvas><div id="surfaces"></div>
<script>
const canvas=document.getElementById('cells'), ctx=canvas.getContext('2d',{alpha:false});
const surfaces=document.getElementById('surfaces'), images=new Map();
const segmenter=new Intl.Segmenter(undefined,{granularity:'grapheme'});
const wideGlyph=/[\u1100-\u115f\u2e80-\ua4cf\uac00-\ud7a3\uf900-\ufaff\ufe10-\ufe6f\uff01-\uff60\u{1f300}-\u{1faff}]/u;
const paths={folder:'M2 4h5l2 2h13v14H2z',file:'M5 2h9l5 5v15H5z M14 2v6h5',image:'M3 3h18v18H3z M3 17l6-6 4 4 3-3 5 5',audio:'M9 18V5l11-2v13 M9 7l11-2 M9 18a3 3 0 1 1-3-3 M20 16a3 3 0 1 1-3-3',video:'M2 5h14v14H2z M16 10l6-4v12l-6-4',archive:'M3 3h18v18H3z M12 3v12 M10 16h4v3h-4z',link:'M9 15l6-6 M8 17l-2 2a4 4 0 0 1-5-5l5-5 M16 7l2-2a4 4 0 0 1 5 5l-5 5'};
function icon(kind){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 24 24');svg.classList.add('icon');const p=document.createElementNS(svg.namespaceURI,'path');p.setAttribute('d',paths[kind]||paths.file);p.setAttribute('fill','none');p.setAttribute('stroke','currentColor');p.setAttribute('stroke-width','1.5');p.setAttribute('stroke-linejoin','round');svg.append(p);return svg;}
let scene;
function rect(node,r,cw,ch){Object.assign(node.style,{left:`${r.x*cw}px`,top:`${r.y*ch}px`,width:`${r.width*cw}px`,height:`${r.height*ch}px`});}
async function paint(s){
  scene=s;
  const {width,height,columns,rows}=s.viewport,cw=width/columns,ch=height/rows;
  if(canvas.width!==width)canvas.width=width;
  if(canvas.height!==height)canvas.height=height;
  ctx.fillStyle=s.background;ctx.fillRect(0,0,width,height);
  const accent=s.accent||s.foreground, border=s.border||s.foreground;
  surfaces.style.setProperty('--border',border);surfaces.style.setProperty('--accent',accent);surfaces.style.setProperty('--tab',s.background);
  const font=Math.max(9,Math.round(Math.min(ch*.84,cw*1.65)));ctx.textBaseline='middle';
  for(const p of s.spans){
    ctx.fillStyle=p.background;
    // The controller's coordinate grid is authoritative, including wide text.
    const chars=Array.from(segmenter.segment(p.text),item=>item.segment);let x=p.x;
    const cells=chars.reduce((sum,c)=>sum+(wideGlyph.test(c)?2:1),0);
    ctx.fillStyle=p.background;
    const x0=Math.floor(x*cw),x1=Math.floor((x+cells)*cw);
    const y0=Math.floor(p.y*ch),y1=Math.floor((p.y+1)*ch);
    ctx.fillRect(x0,y0,x1-x0,y1-y0);
    ctx.fillStyle=p.foreground;ctx.font=`${p.bold?'600':'400'} ${font}px monospace`;
    if(/^[\x20-\x7e]*$/.test(p.text)){
      // Let the font shape each word naturally, while keeping column gaps
      // and controller hit targets on the authoritative grid.
      for(const word of p.text.match(/[^ ]+| +/g)||[]){
        if(word[0]!==' ')ctx.fillText(word,Math.floor(x*cw),Math.round((p.y+.5)*ch),word.length*cw);
        x+=word.length;
      }
      continue;
    }
    for(const c of chars){
      const wide=wideGlyph.test(c)?2:1;
      // Shared integer boundaries avoid antialiased gaps between adjacent
      // opaque backgrounds when the terminal's cell size is fractional.
      // Panels use true pixel borders rather than box-drawing glyphs.
      if(!/[\s╔╗╚╝║═┌┐└┘│─╭╮╰╯]/u.test(c))ctx.fillText(c,x*cw,(p.y+.5)*ch);
      x+=wide;
    }
  }
  surfaces.replaceChildren();
  const loading=[];const used=new Set();
  for(const c of s.components){
    if(c.kind==='terminal')continue;
    let node=document.createElement(c.kind==='image'?'img':'div');node.className='surface';rect(node,c.rect,cw,ch);
    if(['panel','menu','dialog'].includes(c.kind)){
      node.classList.add('panel');if(c.active)node.classList.add('active');
      if(c.kind!=='panel'){
        // Preserve graphical rows underneath while replaying the controller's
        // opaque modal content above them. Filename text never becomes HTML.
        const content=document.createElement('canvas');content.width=Math.round(c.rect.width*cw);content.height=Math.round(c.rect.height*ch);
        content.getContext('2d').drawImage(canvas,c.rect.x*cw,c.rect.y*ch,c.rect.width*cw,c.rect.height*ch,0,0,content.width,content.height);
        node.append(content);
      }
      if(c.kind==='menu')node.style.boxShadow='0 5px 16px #0004';
    }
    if(c.kind==='list_row'){
      node.classList.add('row');if(c.selected)node.classList.add('selected');
      node.style.background=c.background;node.style.color=c.foreground;node.style.fontSize=`${font}px`;
      const mark=document.createElement('span');mark.className=`mark ${c.marked?'on':''}`;
      const name=document.createElement('span');name.className='name';name.textContent=c.label;name.title=c.label;
      node.append(mark,icon(c.icon),name);
    }
    if(c.kind==='text_field'){node.style.background=s.background;node.style.color=s.foreground;node.style.fontSize=`${font}px`;node.textContent=c.secret?'•'.repeat(Math.min(c.text.length,64)):c.text;node.style.borderBottom='1px solid '+accent;}
    if(c.kind==='tab'){
      node.classList.add('tab');if(c.active)node.classList.add('active');node.style.fontSize=`${font}px`;node.style.color=s.foreground;
      const name=document.createElement('span');name.textContent=c.label;Object.assign(name.style,{minWidth:'0',overflow:'hidden',textOverflow:'ellipsis'});node.append(name);
      if(c.close){
        const close=document.createElement('span');close.textContent='×';
        rect(close,{...c.close,x:c.close.x-c.rect.x,y:c.close.y-c.rect.y},cw,ch);
        Object.assign(close.style,{position:'absolute',display:'flex',alignItems:'center',justifyContent:'center'});
        node.style.paddingRight=`${(c.rect.x+c.rect.width-c.close.x)*cw}px`;node.append(close);
      }
    }
    if(c.kind==='meter'){node.classList.add('meter');node.style.background=c.background;const fill=document.createElement('div');fill.style.width=`${Math.max(0,Math.min(1000,c.value))/10}%`;fill.style.background=c.foreground;node.append(fill);}
    if(c.kind==='image'){
      used.add(c.id);if(c.png)images.set(c.id,'data:image/png;base64,'+c.png);
      node.src=images.get(c.id)||'';
      loading.push(node.decode().catch(()=>{}));
    }
    surfaces.append(node);
  }
  for(const id of images.keys())if(!used.has(id))images.delete(id);
  await Promise.all(loading);await document.fonts.ready;
  requestAnimationFrame(()=>requestAnimationFrame(()=>window.star.painted()));
}
window.star.scene(paint);
</script></body></html>
