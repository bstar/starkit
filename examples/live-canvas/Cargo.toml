[package]
name = "starkit-live-canvas"
version = "0.1.0"
edition = "2021"
publish = false
[workspace]
[dependencies]
# Immutable unreleased 0.13 candidate; builds independently of this checkout.
starkit = { git = "https://github.com/bstar/starkit", rev = "41f1a0ee97bae21747dd15a83cb0f94c6f99564d", version = "0.13", default-features = false, features = ["terminal-graphics"] }
anyhow = "1"
serde_json = "1"

# Crossterm 0.29.0 underflows on zero mouse/cursor coordinates. This is the
# upstream parser fix used by AMP/CORD until a crates.io release includes it.
# Cargo only honors patches in the application root; keep it in copied starters.
[patch.crates-io]
crossterm = { git = "https://github.com/crossterm-rs/crossterm", rev = "d4e9929f9a1c4adf91505d54f8527c817ae504cd" }
