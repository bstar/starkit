[package]
name = "starkit-starter"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

# Copy this directory anywhere: it is an independent consumer, not a workspace member.
[workspace]
[features]
default = []
native = ["starkit/terminal-graphics"]
media = ["native", "starkit/media"]
[dependencies]
starkit = { git = "https://github.com/bstar/starkit", rev = "6c8877650bcb87c1a88b5010898278064d91f797", version = "0.9", default-features = false }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
