name: interactive-kitty-macos
# Hosted macOS VMs cannot create Kitty's required OpenGL 3.3 surface (NSGL
# "Failed to find a suitable pixel format"). This gate needs a real Mac with
# a logged-in desktop; the ordinary CI matrix still checks macOS offscreen.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  interactive-kitty:
    runs-on: [self-hosted, macOS, graphical-desktop]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa
      - run: |
          nix develop -c cargo build --example terminal-graphics --features terminal-graphics
          bash scripts/install-test-kitty.sh "$RUNNER_TEMP/kitty-proof"
          python3 -m venv "$RUNNER_TEMP/kitty-proof/python"
          "$RUNNER_TEMP/kitty-proof/python/bin/pip" install Pillow==11.3.0
          "$RUNNER_TEMP/kitty-proof/python/bin/python" scripts/test-kitty-interactive.py \
            --kitty "$RUNNER_TEMP/kitty-proof/runtime/bin/kitty" \
            --kitten "$RUNNER_TEMP/kitty-proof/runtime/bin/kitten" \
            --example "$PWD/target/debug/examples/terminal-graphics" --output kitty-interactive
          "$RUNNER_TEMP/kitty-proof/python/bin/python" scripts/test-kitty-interactive.py \
            --kitty "$RUNNER_TEMP/kitty-proof/runtime/bin/kitty" \
            --kitten "$RUNNER_TEMP/kitty-proof/runtime/bin/kitten" \
            --example "$PWD/target/debug/examples/terminal-graphics" --frontend-failure --output kitty-frontend-loss
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: interactive-kitty-macos
          path: |
            kitty-interactive/
            kitty-frontend-loss/
