name: ci

# Documentation-only changes do not rebuild anything.
on:
  push:
    branches: [main, experiment/terminal-graphics]
    paths-ignore: &docs
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.editorconfig'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore: *docs
  workflow_call:
  workflow_dispatch:

# Nothing here needs write access. Declared rather than inherited, so a change
# to the repository default cannot quietly widen what a workflow may do.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --check
      # dead_code is allowed rather than denied: this is a library, and a
      # module usually lands here complete and tested one work package before
      # the application that will call it. Every other lint is an error.
      - run: cargo clippy --all-targets --all-features -- -D warnings -A dead_code
      # Both ends of the feature matrix. `--all-features` is what the two
      # applications add up to; `--no-default-features` is the build that links
      # no image decoder at all, which nothing else would ever exercise.
      - run: cargo test --all-features
      - run: cargo test --no-default-features

  # What the dependency tree is carrying, which nobody notices by reading it.
  # Two questions: is anything under a known advisory, and is anything under a
  # licence this cannot ship. See `deny.toml` for what is allowed and why.
  #
  # No build dependencies and no compile: this reads `Cargo.lock` and the
  # advisory database, so it is the cheapest job here by a wide margin and can
  # fail fast while the others are still linking.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories bans licenses sources

  msrv:
    # rust-version in Cargo.toml is a promise; this is what makes it true, and
    # it is a promise made to two applications rather than to a package index.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.90"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo check --all-targets --all-features

  # A `consumers` job belongs here and is not here yet.
  #
  # Nothing in this repository can tell whether a signature change breaks the
  # applications that use it, and both of them are the only callers there are.
  # The job checks out staramp and starcord, points each at this checkout with
  # a `[patch]` in a temporary `.cargo/config.toml`, and runs `cargo check
  # --all-targets` in both. It is added once both are published on GitHub;
  # until then it would fail on a repository that does not exist, which teaches
  # everyone to ignore a red tick.

  graphical-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: |
          npm ci --prefix runtime/terminal-graphics
          npm run install-runtime --prefix runtime/terminal-graphics
          node --test runtime/terminal-graphics/capture.test.cjs
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libxcb-xkb1 libxkbcommon-x11-0 libgl1-mesa-dri libegl1
      - if: runner.os == 'Linux'
        # Allow Electron's user-namespace sandbox on the disposable CI runner.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - if: runner.os == 'Linux'
        run: |
          export STAR_GRAPHICS_ELECTRON="$PWD/runtime/terminal-graphics/node_modules/.bin/electron"
          export STAR_GRAPHICS_SOFTWARE=1
          export STAR_GRAPHICS_PLATFORM=x11
          xvfb-run -a cargo run --example terminal-graphics --features terminal-graphics -- graphical-smoke.png
      - if: runner.os == 'macOS'
        run: |
          export STAR_GRAPHICS_ELECTRON="$PWD/runtime/terminal-graphics/node_modules/.bin/electron"
          cargo run --example terminal-graphics --features terminal-graphics -- graphical-smoke.png
      - name: Install private Kitty pixel capture runtime
        if: runner.os == 'Linux'
        run: |
          bash scripts/install-test-kitty.sh "$RUNNER_TEMP/kitty-proof"
          python3 -m venv "$RUNNER_TEMP/kitty-proof/python"
          "$RUNNER_TEMP/kitty-proof/python/bin/pip" install Pillow==11.3.0
      - name: Interactive Kitty pixels on Linux
        if: runner.os == 'Linux'
        run: |
          export STAR_GRAPHICS_ELECTRON="$PWD/runtime/terminal-graphics/node_modules/.bin/electron"
          export STAR_GRAPHICS_SOFTWARE=1 STAR_GRAPHICS_PLATFORM=x11
          export LIBGL_ALWAYS_SOFTWARE=1
          xvfb-run -a "$RUNNER_TEMP/kitty-proof/python/bin/python" scripts/test-fractional-background.py \
            --example "$PWD/target/debug/examples/terminal-graphics" --output fractional-background
          xvfb-run -a "$RUNNER_TEMP/kitty-proof/python/bin/python" scripts/test-kitty-interactive.py \
            --kitty "$RUNNER_TEMP/kitty-proof/runtime/bin/kitty" \
            --kitten "$RUNNER_TEMP/kitty-proof/runtime/bin/kitten" \
            --example "$PWD/target/debug/examples/terminal-graphics" --output kitty-interactive
          xvfb-run -a "$RUNNER_TEMP/kitty-proof/python/bin/python" scripts/test-kitty-interactive.py \
            --kitty "$RUNNER_TEMP/kitty-proof/runtime/bin/kitty" \
            --kitten "$RUNNER_TEMP/kitty-proof/runtime/bin/kitten" \
            --example "$PWD/target/debug/examples/terminal-graphics" --renderer-failure --output kitty-renderer-loss
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: graphical-smoke-${{ matrix.os }}
          path: |
            graphical-smoke.png
            kitty-interactive/
            kitty-renderer-loss/
            fractional-background/
