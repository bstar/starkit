# Ayu Dark — the standard base16 scheme.
# Only the sixteen colours are stated; every role is derived from them,
# so improvements to the derivation reach this theme automatically.

[meta]
name = "Ayu Dark"
id = "ayu-dark"
author = "Khue Nguyen"
variant = "dark"

[base16]
base00 = "#0f1419"
base01 = "#131721"
base02 = "#272d38"
base03 = "#3e4b59"
base04 = "#bfbdb6"
base05 = "#e6e1cf"
base06 = "#e6e1cf"
base07 = "#f3f4f5"
base08 = "#f07178"
base09 = "#ff8f40"
base0A = "#ffb454"
base0B = "#b8cc52"
base0C = "#95e6cb"
base0D = "#59c2ff"
base0E = "#d2a6ff"
base0F = "#e6b673"
