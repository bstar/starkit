# Dracula — the standard base16 scheme.
# Only the sixteen colours are stated; every role is derived from them,
# so improvements to the derivation reach this theme automatically.

[meta]
name = "Dracula"
id = "dracula"
author = "Dracula Theme"
variant = "dark"

[base16]
base00 = "#282a36"
base01 = "#44475a"
base02 = "#44475a"
base03 = "#6272a4"
base04 = "#6272a4"
base05 = "#f8f8f2"
base06 = "#f8f8f2"
base07 = "#ffffff"
base08 = "#ff5555"
base09 = "#ffb86c"
base0A = "#f1fa8c"
base0B = "#50fa7b"
base0C = "#8be9fd"
base0D = "#bd93f9"
base0E = "#ff79c6"
base0F = "#ff5555"
